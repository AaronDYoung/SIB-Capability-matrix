<style>
:root{--bg:#f6f7fb;--surface:#fff;--fg:#141a2e;--muted:#5b6380;--line:#e2e5f0;--dt:#5b2fd6;--no:#c2364a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1020;--surface:#161a2e;--fg:#e8eaf5;--muted:#9aa1bd;--line:#262b45;--dt:#a48bff;--no:#ff7f90;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:14px}
h1{font:700 22px/1.2 Sora,system-ui,sans-serif;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
input:focus{outline:2px solid var(--dt);outline-offset:1px}
button{font:600 15px Sora,system-ui,sans-serif;padding:12px;border:0;border-radius:10px;background:var(--dt);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--no);font-size:13px;min-height:1.2em}
